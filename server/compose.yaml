# 로컬 개발용 PostgreSQL
# 실행: docker compose up -d   /   중지: docker compose down
services:
  postgres:
    image: postgres:17
    container_name: badminton-postgres
    environment:
      POSTGRES_DB: badminton
      POSTGRES_USER: badminton
      POSTGRES_PASSWORD: badminton-local   # 로컬 전용 비밀번호 (운영 환경에서는 절대 사용 금지)
      TZ: Asia/Seoul
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data   # 컨테이너를 꺼도 데이터 유지

volumes:
  postgres-data:
