spring.application.name=badminton-server

# --- DB 연결 (compose.yaml의 PostgreSQL) ---
spring.datasource.url=jdbc:postgresql://localhost:5432/badminton
spring.datasource.username=badminton
spring.datasource.password=${DB_PASSWORD:badminton-local}

# --- JPA ---
# 테이블은 Flyway(SQL 파일)로만 만들고, JPA는 엔티티와 테이블이 맞는지 "검사"만 한다
spring.jpa.hibernate.ddl-auto=validate
# 컨트롤러까지 DB 연결을 끌고 가지 않도록 끔 (성능·버그 예방)
spring.jpa.open-in-view=false
# 실행되는 SQL을 로그로 보기 (개발용)
logging.level.org.hibernate.SQL=debug

# --- Flyway ---
# src/main/resources/db/migration 의 V1__xxx.sql, V2__xxx.sql 을 순서대로 실행
spring.flyway.enabled=true
